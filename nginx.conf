# Konfigurasi Nginx untuk Asesmen SMKN 31 Jakarta
# Simpan file ini di: /etc/nginx/sites-available/assesmen
# Lalu: sudo ln -s /etc/nginx/sites-available/assesmen /etc/nginx/sites-enabled/
# Dan:  sudo nginx -t && sudo systemctl reload nginx

# Upstream ke Next.js (PM2 cluster mode sudah handle load balance internal)
upstream nextjs_app {
    server 127.0.0.1:3333;
    keepalive 64;           # Keep 64 koneksi persistent ke Node.js
}

# Batasi request rate untuk cegah abuse
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=exam_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;          # Ganti dengan domain/IP VPS jika ada

    # Ukuran body request maksimum (untuk upload jawaban/gambar)
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # Gzip compression — kurangi bandwidth drastis
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Cache static assets Next.js — jangan pernah dikirim ulang ke browser yang sama
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Rate limit untuk API exam (auto-save, violation) — 10 req/s per IP
    location /api/exam/ {
        limit_req zone=exam_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Rate limit untuk API lainnya
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Semua halaman lainnya
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
